apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sokos-skattekort-admin
  namespace: okonomi
  labels:
    team: okonomi
  annotations:
    config.linkerd.io/proxy-memory-limit: "512Mi"
    config.linkerd.io/proxy-memory-request: "128Mi"
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/isAlive
    initialDelay: 10
  readiness:
    path: /internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /internal/metrics
  replicas:
    min: 2
    max: 2
  ingresses:
    - "https://sokos-skattekort-admin.intern.nav.no"
    - "https://sokos-skattekort-admin.ansatt.nav.no"
  resources:
    limits:
      cpu: "3"
      memory: 768Mi
    requests:
      cpu: "50m"
      memory: 256Mi
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          - id: "0918ffcf-2cc4-4282-a1d0-757e116a1d9f" # 0000-CA-SKATT-OG-TREKK-ADMIN
          - id: "3849f5dd-e312-4b8e-8cca-752a0d5e59ec" # 0000-CA-SKATTEKORT-ADMIN-WRITE
          - id: "8f27b0f8-b78c-45d3-b0a1-7b3075b636c2" # 0000-CA-SOKOS-UP-SKATTEKORT-ADMIN-WRITE
        extra:
          - NAVident
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /internal/*
  accessPolicy:
    outbound:
      external:
        - host: sokos-skattekort.intern.nav.no
      rules:
        - application: sokos-skattekort
          namespace: okonomi