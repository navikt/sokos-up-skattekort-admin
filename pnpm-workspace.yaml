# pnpm settings for the root project (the client/Vite app).
# Settings apply ONLY to the root install (`pnpm install` at repo root).
# Server-specific overrides live in server/pnpm-workspace.yaml and are NOT inherited.

overrides:
  form-data: 4.0.6
  '@opentelemetry/core': 2.8.0
engineStrict: true
saveExact: true
ignoreScripts: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@opentelemetry/core@2.8.0'
  - form-data@4.0.6
  - '@navikt/aksel-icons@8.17.2'
  - '@navikt/aksel-stylelint@8.17.2'
  - '@navikt/ds-css@8.17.2'
  - '@navikt/ds-react@8.17.2'
  - '@navikt/ds-tokens@8.17.2'
